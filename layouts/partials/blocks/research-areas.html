{{ $items := sort (where site.RegularPages "Section" "research") "Date" "desc" }}
<div class="col-12">
  <div class="research-grid">
    {{ range $items }}
    {{ $item := . }}
    <article class="research-card">
      <a href="{{ .RelPermalink }}" class="research-card-link">
        {{ with .Resources.GetMatch "featured.png" }}
          {{ $image := .Resize "960x webp" }}
          <img src="{{ $image.RelPermalink }}" width="{{ $image.Width }}" height="{{ $image.Height }}" alt="{{ $item.Params.image.alt | default $item.Title }}" loading="lazy" decoding="async">
        {{ end }}
        <h3>{{ .Title }}</h3>
        <p>{{ .Params.summary }}</p>
        <span class="research-card-more">Explore this area <span aria-hidden="true">→</span></span>
      </a>
    </article>
    {{ end }}
  </div>
</div>
